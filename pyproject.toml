[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "kineimu_shoulder"
version = "0.1.0"
description = "Dual-IMU research framework for shoulder movement analysis with tested acquisition and hardware-free replay."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "Hongbo Liao" }]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
    "numpy==2.5.2",
    "pandas==3.0.5",
    "scipy==1.18.1",
]

[project.urls]
Repository = "https://github.com/TheSmashingPumpkinPies/KineIMU-Shoulder"

[project.optional-dependencies]
orientation = ["imufusion==1.3.3"]
calibration = ["imucal==2.6.0"]
analysis = [
    "imufusion==1.3.3",
    "imucal==2.6.0",
]
ble = ["bleak==3.0.2"]
capture = ["pyserial==3.5"]

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.6",
]

[tool.uv]
required-version = "==0.12.5"

[tool.hatch.build]
skip-excluded-dirs = true

[tool.hatch.build.targets.sdist]
only-include = [
    "kineimu_shoulder", "README.md", "LICENSE", "CITATION.cff",
    "THIRD_PARTY_NOTICES.md", "docs/M6_TECHNICAL_REPORT.md", "docs/release",
]

[tool.hatch.build.targets.wheel]
packages = ["kineimu_shoulder"]

[tool.hatch.build.targets.wheel.shared-data]
"docs/release/licenses" = "share/kineimu-shoulder/third-party"

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
markers = ["integration: cross-component integration tests"]

[tool.ruff]
exclude = [".agents", ".cache", ".tmp-*", ".venv", ".venv-*", "docs/reference"]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["kineimu_shoulder"]
